<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ladle &amp; Ember — Night-Market Noodle Stall</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="stall-wrap">
  <canvas id="board" width="1280" height="720" aria-label="Ladle and Ember: run a night-market noodle stall, cook orders and serve them before the tickets walk"></canvas>
  <p class="hint">WASD or arrows to walk · click a counter to walk there · E to grab, cook, plate and serve · P pauses · M mutes</p>
</main>
<p id="status" role="status" aria-live="polite"></p>
<noscript><p class="hint">Ladle &amp; Ember needs JavaScript to run the stall.</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
